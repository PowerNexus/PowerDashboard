# GameDashboard — bêta publique.
#
# Deux processus derrière un seul nom : l'interface Next (:3210) sert tout,
# l'API Nest (:3211) n'est jointe que sur les préfixes qui doivent l'être
# depuis l'extérieur. Ce n'est pas une optimisation, c'est la règle
# d'exposition : le reste de l'API — administration, revendeurs, espace client —
# n'est appelé que par l'interface, depuis la machine, sur la boucle locale.

# Limitation par adresse, en amont de l'application.
#
# Trois zones, parce que trois rythmes légitimes : une intégration tierce
# appelle l'API applicative en rafale, une supervision relit le statut toutes
# les minutes, et personne ne se connecte dix fois par seconde. Le compteur
# applicatif (verrou par compte et par adresse) reste la protection de fond ;
# celle-ci évite seulement que l'API paie chaque tentative.
limit_req_zone $binary_remote_addr zone=gd_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=gd_app:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=gd_status:10m rate=1r/s;

# Le code de refus est posé **dans le serveur**, pas ici.
#
# `limit_req_status` ne s'admet qu'une fois par contexte, et un autre vhost de
# cette machine le déclare déjà au niveau `http` — les deux fichiers sont
# inclus dans le même bloc, et nginx refusait alors de démarrer. Les zones,
# elles, doivent rester ici : elles ne sont déclarables qu'au niveau `http`.
#
# C'est la règle de cette machine partagée : tout ce qu'on ajoute doit tenir
# dans son propre périmètre.

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.fr;

    # Voir plus haut : ce code vit dans le serveur pour ne pas entrer en
    # conflit avec un autre vhost de la machine.
    limit_req_status 429;

    # Certificat générique *.matheol.fr déjà émis et renouvelé par certbot :
    # aucune émission supplémentaire, donc aucun risque d'atteindre la limite
    # de Let's Encrypt en redéployant.
    ssl_certificate     /etc/letsencrypt/live/matheol.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matheol.fr/privkey.pem;
    include snippets/tls/tls-intermediate.conf;

    charset utf-8;
    # Les envois de fichiers vers un serveur de jeu ne passent **pas** par ici :
    # le navigateur les adresse directement au daemon, avec un jeton signé.
    # Ce qui transite par le rendu — formulaires, JSON d'egg collé — tient
    # dans quelques mégaoctets ; au-delà, ce serait un moyen d'occuper la
    # mémoire du rendu.
    client_max_body_size 16M;

    access_log /var/log/nginx/panel.example.fr.access.log;
    error_log  /var/log/nginx/panel.example.fr.error.log;

    # Il s'agit d'une bêta : elle ne doit pas être indexée, et surtout pas
    # figurer dans des résultats de recherche une fois remplacée.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS se pose ici et non dans l'application : c'est nginx qui termine TLS.
    # Un an, sans `preload` ni `includeSubDomains` : l'hôte est partagé et
    # d'autres sous-domaines de matheol.fr ne sont pas forcément en HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ------------------------------------------------------------------
    # API applicative — le seul préfixe d'API ouvert au monde.
    #
    # C'est par là que le système de facturation tiers crée les comptes et les
    # serveurs. Il s'authentifie par clé applicative à portées ; le reste de
    # l'API n'a aucune raison d'être joignable d'ailleurs que de la machine.
    # ------------------------------------------------------------------
    location /api/v1/application/ {
        limit_req zone=gd_app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Contrat Wings.
    #
    # Les daemons appellent le panel depuis leurs propres machines, avec le
    # jeton du node. Wings étant inchangé, ces chemins sont imposés : ils ne
    # peuvent pas être déplacés sous un autre préfixe.
    # ------------------------------------------------------------------
    location /api/remote/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un transfert de serveur entre nodes tient la requête longtemps.
        proxy_read_timeout 600s;
    }

    # Mise en service d'un daemon : `wings configure` vient y chercher la
    # configuration du node. Le chemin n'a pas de « v1 » et ce n'est pas un
    # oubli — il est codé en dur dans Wings, au même titre que /api/remote.
    #
    # Une seule route y répond, et elle exige la portée `nodes.configure` :
    # sa réponse contient le jeton du daemon.
    location /api/application/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Spécification OpenAPI : publique, pour qu'un intégrateur génère son
    # client sans ouvrir de compte. Même zone de limitation que le statut —
    # elle est lue par des outils, qui savent boucler.
    location = /api/v1/openapi.json {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statut public : lisible sans compte, par construction. L'exposer
    # directement permet à une supervision tierce de l'interroger sans rendre
    # une page entière.
    location = /api/v1/status {
        limit_req zone=gd_status burst=10 nodelay;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Écrans d'authentification : mêmes réglages que l'interface, plus une
    # limite par adresse. Les envois de formulaire (actions serveur de Next)
    # partent sur l'URL de la page, c'est donc ici qu'ils se comptent. La
    # rafale laisse passer un chargement de page et ses ressources.
    location ~ ^/(login|register|forgot-password|reset|verify)$ {
        limit_req zone=gd_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Interface.
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        # La console d'un serveur de jeu est un WebSocket relayé par un route
        # handler de Next. Sans ces deux en-têtes, la console reste muette
        # sans qu'aucune erreur ne s'affiche.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $req_connection;
        proxy_set_header Host              $host;
        # Réécrit, jamais relayé : le rendu en tire le domaine des liens de
        # réinitialisation, et un client pourrait sinon y placer le sien.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une console ouverte ne parle pas forcément toutes les minutes.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

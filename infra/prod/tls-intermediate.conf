# Réglages TLS du vhost, profil « intermédiaire » de Mozilla : TLS 1.2 et 1.3,
# suites à confidentialité persistante seulement.
#
# Installé par deploy.sh dans /etc/nginx/snippets/tls/ **s'il n'existe pas** :
# une machine qui porte déjà sa propre version la garde, parce que d'autres
# vhosts l'incluent peut-être.
#
# Pas de suites DHE : elles demandent un fichier de paramètres Diffie-Hellman
# que rien ici ne génère, et les navigateurs actuels n'en ont pas besoin.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Zone nommée pour ce panel : un autre vhost qui déclarerait `shared:SSL` avec
# une autre taille ferait refuser la configuration.
ssl_session_cache shared:gd_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

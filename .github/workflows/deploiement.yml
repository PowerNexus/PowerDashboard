name: Construction continue

# Construit le panel après chaque CI verte sur main, et pousse la construction
# sur la branche `deploiement` : c'est elle que suit un hébergement cPanel,
# par infra/cpanel/deployer.sh (docs/hebergement-cpanel.md).
#
# Un hébergement mutualisé n'a ni la mémoire ni le temps que demande
# `next build` : l'interface est construite ici, une fois.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Republier la construction de main, après une panne du runner par exemple.
  workflow_dispatch:

# Une publication à la fois, dans l'ordre : la plus récente arrive en dernier.
concurrency:
  group: construction-continue
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  publier:
    name: Compiler et publier
    # Seulement un push sur main passé par la CI : jamais le code d'une PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Même runner que la CI (docs/runner-auto-heberge.md).
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 20
    permissions:
      # Pousser la branche `deploiement`.
      contents: write

    env:
      # Le commit que la CI a vérifié, pas celui qu'aurait main entre-temps.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.COMMIT }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Aucun secret : les clés ne sont lues qu'à l'exécution, sur le serveur.
      - name: Compiler
        run: pnpm build

      - name: Publier sur la branche deploiement
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash infra/cpanel/publier-construction.sh origin deploiement

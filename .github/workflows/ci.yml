name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par release.yml : aucune version ne se publie sans avoir passé
  # exactement les mêmes vérifications qu'une PR.
  workflow_call:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Les jobs tournent sur un runner auto-hébergé (docs/runner-auto-heberge.md).
# La variable de dépôt CI_RUNNER, en JSON, choisit une autre cible sans
# toucher aux workflows : '"ubuntu-latest"' pour revenir aux runners de GitHub.

env:
  # Turbo télémétrie désactivée : rien ne sort de la CI sans raison.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, types, tests et build
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # Cache distant réservé aux runners de GitHub : sur une machine à
          # nous le store pnpm reste sur disque, et téléverser ses 240 Mo à
          # chaque job coûtait plus de deux minutes.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      # --frozen-lockfile : la CI échoue si le lockfile ne correspond pas au
      # package.json, plutôt que de résoudre silencieusement d'autres versions.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Le build a besoin des variables d'environnement, mais aucun secret
      # n'est requis pour compiler : les clés ne sont lues qu'à l'exécution.
      - name: Build
        run: pnpm build

      # Storybook est la référence visuelle de l'équipe : une histoire qui ne
      # compile plus doit se voir ici, pas le jour où quelqu'un veut consulter
      # un composant.
      - name: Build Storybook
        run: pnpm --filter @gamedashboard/ui build-storybook

      # Le schéma Drizzle et les migrations doivent rester en phase. Sans cette
      # vérification, une colonne ajoutée au schéma sans migration ne se verrait
      # qu'au déploiement, face à une base qui ne la possède pas.
      # `db:check` et non `db:generate` seul : sans terminal, drizzle-kit
      # sort en succès même quand il s'arrête sur une question (voir
      # packages/db/scripts/check-migrations.mjs).
      - name: Migrations à jour
        run: |
          pnpm db:check \
            || { echo "::error::Schéma et migrations désaccordés. Lancez pnpm db:generate et relisez la migration produite."; exit 1; }

      # Même raison, pour l'autre contrat : une route ajoutée au catalogue sans
      # régénérer la spécification donnerait un `openapi.json` qui décrit une
      # API d'hier. Ceux qui en génèrent leur client ne le verraient jamais —
      # ils obtiendraient simplement un client sans la nouvelle route.
      - name: Spécification OpenAPI à jour
        run: |
          pnpm openapi
          git diff --exit-code openapi.json \
            || { echo "::error::Catalogue de routes modifié sans régénérer la spécification. Lancez pnpm openapi."; exit 1; }

  audit:
    name: Audit de sécurité des dépendances
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # Cache distant réservé aux runners de GitHub : sur une machine à
          # nous le store pnpm reste sur disque, et téléverser ses 240 Mo à
          # chaque job coûtait plus de deux minutes.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Bloquant dès le niveau « low » : le projet part propre, autant le
      # garder ainsi plutôt que d'accumuler une dette qu'on cessera de lire.
      - name: pnpm audit
        run: pnpm audit --audit-level low

      # Informe sans bloquer : une nouvelle version sortie le matin même ne
      # doit pas empêcher de livrer, mais elle doit se voir.
      - name: Versions en retard
        continue-on-error: true
        run: pnpm outdated -r

      # Trivy lit le système de fichiers : dépendances **et** fichiers de
      # configuration. `pnpm audit` ne connaît que le registre npm — il ne voit
      # ni un Dockerfile qui tourne en root, ni un secret laissé dans un
      # fichier d'exemple, ni une image de base périmée.
      # Épinglée par empreinte : en mars 2026, les tags de trivy-action ont été
      # réécrits vers un voleur de secrets (corrigé en 0.35.0). Vaut pour toutes
      # les actions tierces, vérifié par infra-prod.test.ts.
      - name: Trivy — dépendances et configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: node_modules,.next,.turbo

      # Semgrep cherche des motifs dans **notre** code, là où les deux autres
      # regardent ce qu'on importe. C'est le seul des trois qui puisse voir une
      # requête concaténée ou une comparaison de secret non constante.
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/typescript p/nodejs p/secrets p/owasp-top-ten

      # L'action Semgrep tourne dans un conteneur, en root, et écrit dans
      # l'espace de travail (objets git de sa comparaison avec la base). Sur
      # un runner auto-hébergé, ces fichiers survivent au job : le checkout
      # suivant, lancé par l'utilisateur du runner, échouait sur
      # « insufficient permission for adding an object to repository
      # database .git/objects ». On les lui rend, même si le job a échoué,
      # avec le dossier temporaire que le conteneur a aussi reçu.
      - name: Rendre l'espace de travail au runner
        if: always()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP:/t" \
            alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            chown -R "$(id -u):$(id -g)" /w /t

  e2e:
    name: Parcours critiques et accessibilité
    # Jamais le code d'une PR venue d'un fork sur nos machines : voir
    # docs/runner-auto-heberge.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 25

    # Une vraie base : l'interface est éprouvée contre l'API réelle, qui parle
    # à PostgreSQL. Une API simulée validerait le panel contre une fiction.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gamedashboard
          POSTGRES_PASSWORD: gamedashboard
          POSTGRES_DB: gamedashboard
          TZ: UTC
        # Port choisi par Docker : un PostgreSQL déjà présent sur la machine
        # du runner garde le 5432, et deux runners voisins ne se gênent pas.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U gamedashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Clé d'essai, valable pour cette exécution seule. Elle ne déchiffre rien
      # d'autre que ce que la même exécution vient d'écrire.
      APP_SECRET_KEY: cle-de-test-ci-0123456789abcdef0123456789abcdef
      E2E_EMAIL: e2e@gamedashboard.test
      E2E_PASSWORD: Essai-E2E-2026!motdepasse

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # Cache distant réservé aux runners de GitHub : sur une machine à
          # nous le store pnpm reste sur disque, et téléverser ses 240 Mo à
          # chaque job coûtait plus de deux minutes.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le contexte `job` n'existe pas au niveau du job : l'adresse de la base,
      # qui dépend du port attribué, est donc posée ici pour la suite.
      - name: Adresse de la base
        run: echo "DATABASE_URL=postgres://gamedashboard:gamedashboard@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/gamedashboard" >> "$GITHUB_ENV"

      # Les bibliothèques système de Chromium demandent apt, donc root. Un
      # runner auto-hébergé sans sudo sans mot de passe les a reçues à son
      # installation (docs/runner-auto-heberge.md) : on ne pose que le
      # navigateur.
      - name: Installer le navigateur
        run: |
          if sudo -n true 2>/dev/null; then
            pnpm --filter @gamedashboard/web exec playwright install --with-deps chromium
          else
            pnpm --filter @gamedashboard/web exec playwright install chromium
          fi

      - name: Migrations
        run: pnpm --filter @gamedashboard/db db:migrate

      # Le compte d'essai est créé par le **vrai** chemin de création : c'est
      # le code de l'application qui hache le mot de passe, et non un condensat
      # fabriqué à côté qui pourrait diverger de ce que la connexion attend.
      - name: Compte d'essai
        run: |
          pnpm --filter @gamedashboard/api exec tsx scripts/create-admin.mts \
            "$E2E_EMAIL" Essai CI
          GD_PASSWORD="$E2E_PASSWORD" \
            pnpm --filter @gamedashboard/api exec tsx scripts/reset-password.mts "$E2E_EMAIL"

      - name: Construire
        run: pnpm build

      - name: Parcours et accessibilité
        run: pnpm e2e

      # Seulement en cas d'échec : c'est précisément quand la suite est rouge
      # qu'on a besoin des traces et des captures ; une suite verte n'a rien à
      # montrer. Non bloquant : un quota de stockage d'artefacts atteint ne
      # doit pas rendre rouge une suite qui a passé.
      - name: Rapport
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
